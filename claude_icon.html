<head>
<meta charset="UTF-8">

<title>CommonScents</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–ink: #0e0c0a;
–gold: #b89a5a;
–gold-light: #d4b97a;
–cream: #f5f0e8;
–warm-white: #faf8f4;
–mist: #e8e2d8;
}

body {
background: var(–ink);
display: flex;
align-items: center;
justify-content: center;
min-height: 100vh;
font-family: ‘Tenor Sans’, sans-serif;
overflow: hidden;
}

/* Subtle grain overlay */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background-image: url(“data:image/svg+xml,%3Csvg viewBox=‘0 0 200 200’ xmlns=‘http://www.w3.org/2000/svg’%3E%3Cfilter id=‘n’%3E%3CfeTurbulence type=‘fractalNoise’ baseFrequency=‘0.75’ numOctaves=‘4’ stitchTiles=‘stitch’/%3E%3C/filter%3E%3Crect width=‘100%25’ height=‘100%25’ filter=‘url(%23n)’ opacity=‘0.04’/%3E%3C/svg%3E”);
background-size: 180px;
opacity: 0.35;
pointer-events: none;
z-index: 0;
}

/* Radial ambient light from center */
body::after {
content: ‘’;
position: fixed;
inset: 0;
background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(184,154,90,0.07) 0%, transparent 70%);
pointer-events: none;
z-index: 0;
}

.stage {
position: relative;
z-index: 1;
display: flex;
flex-direction: column;
align-items: center;
gap: 0;
animation: rise 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
opacity: 0;
transform: translateY(24px);
}

@keyframes rise {
to { opacity: 1; transform: translateY(0); }
}

/* ── ICON ── */
.icon-wrap {
position: relative;
width: 120px;
height: 120px;
display: flex;
align-items: center;
justify-content: center;
margin-bottom: 28px;
}

/* Outer ring — slow rotation */
.ring-outer {
position: absolute;
inset: 0;
border-radius: 50%;
border: 1px solid rgba(184,154,90,0.25);
animation: spin-slow 18s linear infinite;
}
.ring-outer::before {
content: ‘’;
position: absolute;
top: -3px; left: 50%;
transform: translateX(-50%);
width: 5px; height: 5px;
border-radius: 50%;
background: var(–gold);
box-shadow: 0 0 8px var(–gold);
}

/* Inner ring — counter-rotation */
.ring-inner {
position: absolute;
inset: 14px;
border-radius: 50%;
border: 1px solid rgba(184,154,90,0.15);
animation: spin-slow 12s linear infinite reverse;
}

@keyframes spin-slow {
to { transform: rotate(360deg); }
}

/* SVG flacon icon */
.flacon-svg {
position: relative;
z-index: 2;
animation: float 5s ease-in-out infinite;
}

@keyframes float {
0%, 100% { transform: translateY(0px); }
50% { transform: translateY(-5px); }
}

/* ── WORDMARK ── */
.wordmark {
display: flex;
flex-direction: column;
align-items: center;
gap: 0;
}

.rule-top {
width: 220px;
height: 1px;
background: linear-gradient(90deg, transparent, var(–gold), transparent);
margin-bottom: 18px;
animation: expand 1.4s 0.4s cubic-bezier(0.16,1,0.3,1) both;
transform-origin: center;
transform: scaleX(0);
}

.rule-bottom {
width: 220px;
height: 1px;
background: linear-gradient(90deg, transparent, var(–gold), transparent);
margin-top: 14px;
animation: expand 1.4s 0.6s cubic-bezier(0.16,1,0.3,1) both;
transform-origin: center;
transform: scaleX(0);
}

@keyframes expand {
to { transform: scaleX(1); }
}

.brand-name {
font-family: ‘Cormorant Garamond’, Georgia, serif;
font-weight: 300;
font-size: 3.6rem;
letter-spacing: 0.22em;
color: var(–cream);
text-transform: uppercase;
line-height: 1;
position: relative;
}

/* Gold shimmer sweep */
.brand-name::after {
content: ‘COMMONSCENTS’;
position: absolute;
inset: 0;
background: linear-gradient(105deg, transparent 30%, rgba(212,185,122,0.9) 50%, transparent 70%);
background-size: 300% 100%;
-webkit-background-clip: text;
background-clip: text;
-webkit-text-fill-color: transparent;
animation: shimmer 4s 1.8s ease-in-out infinite;
}

@keyframes shimmer {
0% { background-position: 200% 0; }
40%, 100% { background-position: -100% 0; }
}

.tagline {
font-family: ‘Tenor Sans’, sans-serif;
font-size: 0.6rem;
letter-spacing: 0.45em;
color: var(–gold);
text-transform: uppercase;
margin-top: 10px;
opacity: 0.85;
}

/* ── CORNER ORNAMENTS ── */
.ornament {
position: fixed;
width: 60px;
height: 60px;
opacity: 0.18;
}
.ornament svg { width: 100%; height: 100%; }
.ornament–tl { top: 24px; left: 24px; }
.ornament–tr { top: 24px; right: 24px; transform: scaleX(-1); }
.ornament–bl { bottom: 24px; left: 24px; transform: scaleY(-1); }
.ornament–br { bottom: 24px; right: 24px; transform: scale(-1); }

</style>
</head>
